# Runs the native smoke tests with the latest Codex and Claude Code CLIs so behavior changes
# surface before users report them. Records the exact resolved versions. A separate job with
# only issues: write keeps one open drift issue current and closes it after recovery.
name: cli-drift

on:
  schedule:
    - cron: '41 7 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: cli-drift
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DISABLE_AUTOUPDATER: '1'
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'

jobs:
  smoke-latest:
    name: smoke-latest (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Require trusted default-branch code
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::cli-drift runs only from main, not $REF"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install latest host CLIs
        env:
          OS: ${{ matrix.os }}
        run: |
          mkdir -p drift-results
          npm install -g @openai/codex@latest @anthropic-ai/claude-code@latest
          npm ls -g --depth=0 --json > "$RUNNER_TEMP/npm-global.json"
          jq --arg os "$OS" --arg codex "$(codex --version)" --arg claude "$(claude --version)" \
            '{os: $os, codex: $codex, claude: $claude,
              packages: {codex: .dependencies["@openai/codex"].version, claude: .dependencies["@anthropic-ai/claude-code"].version}}' \
            "$RUNNER_TEMP/npm-global.json" > "drift-results/${OS}.json"
          cat "drift-results/${OS}.json"
          npm run prereqs -- --hosts
      - name: Claude marketplace and package validation
        run: |
          claude plugin validate .
          shopt -s nullglob
          for dir in plugins/claude-code/*/; do claude plugin validate "$dir"; done
      - name: Synthetic A to B smoke
        run: node scripts/synthetic-smoke.mjs --matrix
      - name: Plan released-plugin smoke
        id: plan
        run: node scripts/ci.mjs smoke-plan
      - name: Released-plugin smoke
        if: steps.plan.outputs.mode == 'fresh'
        run: bash scripts/smoke.sh .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: drift-${{ matrix.os }}
          path: drift-results/
          retention-days: 30
          if-no-files-found: warn

  report:
    needs: smoke-latest
    if: ${{ always() && (needs.smoke-latest.result == 'success' || needs.smoke-latest.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: drift-*
          path: drift-results
          merge-multiple: true
      - name: Open, update or close the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.smoke-latest.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='CLI drift: native smoke fails with the latest host CLIs'
          {
            echo "Result: **$RESULT** in $RUN_URL"
            echo
            echo '| Runner | Codex | Claude Code |'
            echo '| --- | --- | --- |'
            shopt -s nullglob
            for f in drift-results/*.json; do
              jq -r '"| \(.os) | \(.codex) | \(.claude) |"' "$f"
            done
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md"
          number=$(gh issue list --repo "$REPO" --state open --limit 200 --json number,title \
            | jq -r --arg t "$title" '[.[] | select(.title == $t)] | sort_by(.number) | first | .number // empty')
          if [ "$RESULT" = failure ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$REPO" --body-file "$RUNNER_TEMP/body.md"
            else
              {
                echo 'The weekly smoke run with the latest Codex and Claude Code CLIs failed.'
                echo 'Keep validate.yml on its pinned CLIs until this passes, then move the pins forward.'
                echo
                cat "$RUNNER_TEMP/body.md"
              } > "$RUNNER_TEMP/new.md"
              gh issue create --repo "$REPO" --title "$title" --body-file "$RUNNER_TEMP/new.md"
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body-file "$RUNNER_TEMP/body.md"
            gh issue close "$number" --repo "$REPO" --reason completed
          else
            echo "no open drift issue; nothing to report"
          fi
